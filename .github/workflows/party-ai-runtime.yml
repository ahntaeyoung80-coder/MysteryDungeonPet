name: Build and verify party AI Windows runtime
on:
  push:
    branches: [fix/party-ai-runtime]
permissions:
  contents: read
concurrency:
  group: party-ai-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relationship-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-offline.txt
      - run: python -m tools.prepare_relationship_actors --report build/relationship-actors.json
      - uses: actions/upload-artifact@v4
        with:
          name: party-ai-relationship-actors
          path: |
            assets/original/gameplay/actors/asset-3/**
            assets/original/gameplay/actors/runtime-index.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-ai-relationship-evidence
          path: build/relationship-actors.json
          if-no-files-found: warn
  party-preflight:
    needs: relationship-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-relationship-actors
          path: assets/original/gameplay/actors
      - run: cmake -S . -B build/preflight -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/preflight --target pet_companion_tests pet_gameplay_tests pet_navigation_recovery_tests --parallel 2
      - name: Run party, lifecycle restore and navigation regressions
        run: |
          task_test_result=0
          build/preflight/pet_companion_tests --party-ai-followup || task_test_result=1
          build/preflight/pet_gameplay_tests assets/original/gameplay || task_test_result=1
          build/preflight/pet_navigation_recovery_tests || task_test_result=1
          exit "$task_test_result"
  windows:
    needs: party-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-relationship-actors
          path: assets/original/gameplay/actors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the tracked runtime from this source
        shell: pwsh
        run: |
          cmake -S . -B build/windows -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build/windows --config Release --target MysteryDungeonPet
          if ($LASTEXITCODE -ne 0) { throw 'runtime build failed' }
          python tools/check_windows_runtime.py --refresh-from build/windows/Release/MysteryDungeonPet.exe --compiler "MSVC x64 Release (GitHub Actions Windows)"
          if ($LASTEXITCODE -ne 0) { throw 'runtime refresh failed' }
      - name: Probe zero-argument launch before the full regression suite
        shell: pwsh
        run: ./tests/default_launch_windows_tests.ps1 -Exe build/windows/Release/MysteryDungeonPet.exe -Output build/windows/default-probe
      - name: Verify all party AI follow-up requirements
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target pet_companion_tests
          if ($LASTEXITCODE -ne 0) { throw 'party test build failed' }
          & build/windows/Release/pet_companion_tests.exe --party-ai-followup 2>&1 | Tee-Object build/windows/party-ai-followup.txt
          exit $LASTEXITCODE
      - name: Verify native core, GUI, installed and tracked runtime
        shell: pwsh
        run: ./tools/run_windows_checks.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: party-ai-built-runtime
          path: |
            MysteryDungeonPet.exe
            windows-runtime.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-ai-windows-validation
          path: |
            build/windows/default-probe/**
            build/windows/default-launch-results/**
            build/windows/Testing/Temporary/LastTest.log
            build/windows/party-ai-followup.txt
            build/windows/wic-results/*
            build/windows/companion-results/**
            build/windows/movement-results/*
            build/windows/navigation-results/*
            build/windows/entry-results/*
            build/windows/exploration-results/**
            build/windows/playback-results/**
          if-no-files-found: warn
  core:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-relationship-actors
          path: assets/original/gameplay/actors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-built-runtime
          path: .
      - run: python tools/check_windows_runtime.py
      - run: python tools/make_fixture.py --check
      - run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build/linux
      - run: ctest --test-dir build/linux --output-on-failure
      - run: python -m pip install -r requirements-offline.txt
      - run: python -m unittest discover -s tests -v
        env:
          PET_PACKAGE_INSPECT: ${{ github.workspace }}/build/linux/pet_package_inspect
          PET_EXPLORE: ${{ github.workspace }}/build/linux/pet_explore
  publish-runtime:
    needs: [windows, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-relationship-actors
          path: assets/original/gameplay/actors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: party-ai-built-runtime
          path: .
      - name: Check this binary and advance only the unchanged work branch
        shell: bash
        run: |
          python tools/check_windows_runtime.py
          git fetch origin fix/party-ai-runtime
          task_remote_ref=$(git rev-parse origin/fix/party-ai-runtime)
          if [ "$task_remote_ref" != "$GITHUB_SHA" ]; then
            echo "Branch advanced during verification; leave the newer work unchanged."
            exit 1
          fi
          git add MysteryDungeonPet.exe windows-runtime.json assets/original/gameplay/actors/asset-3 assets/original/gameplay/actors/runtime-index.json
          if git diff --cached --quiet; then
            echo "Verified runtime already matches the tracked files."
            exit 0
          fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: refresh verified Windows runtime [skip ci]"
          git push origin HEAD:refs/heads/fix/party-ai-runtime
